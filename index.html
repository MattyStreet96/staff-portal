var ROLE_COL = {'Track Marshal':'#c8961e','Reception':'#2f7dd1','Race Director':'#d22a2f','Duty Manager':'#16150f','Events Host':'#8a4fd1','Mechanic':'#1d7a46','Track Maintenance':'#b86e00','Cleaner':'#6b6860'};
var PRESETS = [['09:00','17:00'],['10:00','18:00'],['12:00','20:00'],['16:00','22:00'],['17:00','23:00']];
function pYmd(s){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return new Date(+m[1],+m[2]-1,+m[3]); }
function toYmd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function addD(s,n){ var d=pYmd(s); d.setDate(d.getDate()+n); return toYmd(d); }
function monday(s){ var d=pYmd(s||toYmd(new Date())); d.setDate(d.getDate()-((d.getDay()+6)%7)); return toYmd(d); }
function dayName(s, long){ return pYmd(s).toLocaleDateString('en-GB',long?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short'}); }
function dayNum(s){ return pYmd(s).getDate(); }
function weekLabel(ws){ var a=pYmd(ws), b=pYmd(addD(ws,6)); return a.getDate()+' '+a.toLocaleDateString('en-GB',{month:'short'})+' to '+b.getDate()+' '+b.toLocaleDateString('en-GB',{month:'short',year:'numeric'}); }
function money(n){ return '£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function hrs(n){ n=Math.round((Number(n)||0)*10)/10; return n+'h'; }
function roleCol(r){ return ROLE_COL[r]||'var(--muted)'; }

function drawWeek(d){

var holFor = function(sid, day){ return d.holidays.filter(function(h){ return h.staffId===sid && h.from<=day && h.to>=day; })[0]; };
var cell = function(r, day, i){
var list = d.shifts.filter(function(s){ return (s.staffId||'')===r.id && s.date===day; });
var hol = !r.open && holFor(r.id, day), av = !r.open && (d.availability[r.id]||[])[i];
var cls = 'rc'+(day===today?' today':'')+(av&&av.available==='Unavailable'?' unav':'');
var inner = (hol?'<div class="hol '+(hol.status==='Pending'?'pend':'')+'">'+(hol.status==='Pending'?'Holiday requested':'Holiday')+'</div>':'')+

function letterFor(kind, d, f){

var size=function(){ var r=pad.getBoundingClientRect(); pad.width=r.width*2; pad.height=r.height*2; ctx=pad.getContext('2d'); ctx.scale(2,2); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111'; ctx.fillStyle='#fff'; ctx.fillRect(0,0,r.width,r.height); inked=0; onInk&&onInk(); };
var pt=function(e){ var r=pad.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
pad.addEventListener('pointerdown',function(e){ drawing=true; last=pt(e); pad.setPointerCapture(e.pointerId); e.preventDefault(); });
pad.addEventListener('pointermove',function(e){ if(!drawing) return; var p=pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); inked+=Math.abs(p.x-last.x)+Math.abs(p.y-last.y); last=p; onInk&&onInk(); e.preventDefault(); });
['pointerup','pointercancel','pointerleave'].forEach(function(t){ pad.addEventListener(t,function(){ drawing=false; }); });
return { size:size, inked:function(){ return inked>60; }, data:function(){ return pad.toDataURL('image/png'); } };
}
